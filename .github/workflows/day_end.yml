name: AI NSE Day End Report

on:

  workflow_dispatch:

  schedule:
    # 5:15 PM IST = 11:45 AM UTC
    # Monday-Friday
    - cron: "45 11 * * 1-5"

jobs:

  day_end_report:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    - name: Run Day End Report
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python day_end_report.py
