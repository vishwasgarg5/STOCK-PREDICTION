name: AI NSE STOCK PREDICTION

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1-5"   # Runs daily at 10:00 AM IST (Mon-Fri)

jobs:

  stock_prediction:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    - name: Train ML Models
      run: |
        python train.py


    - name: Run AI Stock Prediction
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python main.py
